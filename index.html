<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERA X | Reposição</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        :root { 
            --brand: #3b82f6; 
            --primary: #fbbf24;
            --bg-deep: #020617; 
            --surface: #0f172a; 
            --bg-page: #f8fafc;
            --header-dark: #0f172a;
            --primary-blue: #2563eb;
            --zebra-blue: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-deep); color: #f8fafc; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
        
        .nav-bar { display: flex; gap: 4px; background: #000; padding: 5px; border-radius: 1rem; border: 1px solid #1e293b; flex-wrap: wrap; justify-content: center; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 0.75rem; color: #475569; cursor: pointer; transition: 0.2s; min-width: 70px; }
        .nav-item i { font-size: 1.1rem; margin-bottom: 3px; }
        .nav-item span { font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .nav-item.active { background: var(--brand); color: white; font-weight: 900; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        .reposicao-er-dashboard {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            color: var(--text-main);
            margin-bottom: 24px;
        }
        .reposicao-er-header {
            background: var(--header-dark);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .reposicao-er-header h3 {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0;
        }
        .btn-voltar {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            background: #1e293b;
        }
        .reposicao-er-table {
            width: 100%;
            border-collapse: collapse;
        }
        .reposicao-er-table th {
            background: #fdfdfd;
            padding: 10px 12px;
            text-align: left;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
        }
        .reposicao-er-table td {
            padding: 10px 12px;
            font-size: 0.8rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .reposicao-er-table tr:nth-child(even) { background-color: var(--zebra-blue); }
        .badge-pendente {
            display: inline-flex;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 800;
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-copiar-er {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            margin: 12px;
            width: calc(100% - 24px);
        }
        .btn-copiar-er:hover { background: #1d4ed8; }
        .btn-copiar-er.success { background: #10b981; }
        .reposicao-er-loader {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
        .btn-ver-lista {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-ver-lista:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }
        .pending-badge-header {
            background: #ef4444;
            color: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 800;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .input-pro { background: #000; border: 2px solid #1e293b; color: white; border-radius: 0.75rem; font-family: 'JetBrains Mono', monospace; text-align: center; }
        
        .simple-list-item { background: var(--surface); border-radius: 0.75rem; padding: 12px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid var(--brand); }
        .simple-list-code { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--brand); font-size: 1.1rem; }
        .simple-list-qty { background: #1e293b; padding: 4px 10px; border-radius: 20px; font-weight: 800; color: #fbbf24; }

        .notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 350px; width: calc(100% - 40px); pointer-events: none; }
        .notification { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); display: flex; align-items: flex-start; gap: 12px; transform: translateX(400px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto; border-left: 4px solid transparent; }
        .notification.show { transform: translateX(0); opacity: 1; }
        .notification.success { border-left-color: #10b981; }
        .notification.warning { border-left-color: #f59e0b; }

        .dash-chip { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; width: fit-content; }
        .dash-bar { height: 6px; width: 80px; background: #0f172a; border-radius: 3px; overflow: hidden; }
        .dash-fill { height: 100%; background: var(--brand); transition: width 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print { 
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div id="notification-container" class="notification-container"></div>

    <div id="loader" class="fixed inset-0 z-[100] bg-slate-950/90 flex items-center justify-center hidden">
        <div class="flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-blue-500 font-bold text-xs uppercase tracking-widest">Sincronizando Base...</p>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto space-y-6 no-print">
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/40 p-5 rounded-2xl border border-white/5 gap-6 shadow-xl">
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg"><i class="fa-solid fa-bolt text-white text-2xl"></i></div>
                    <div>
                        <h1 class="text-2xl font-black uppercase tracking-tighter">OPERA <span class="text-blue-500">X</span></h1>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Dev: Benilson Amorim</p>
                    </div>
                </div>
                <div class="dash-chip">
                    <div class="flex flex-col">
                        <span class="text-[8px] font-black text-slate-400 uppercase">Endereçamento</span>
                        <div class="flex items-center gap-2">
                            <div class="dash-bar"><div id="dash-fill" class="dash-fill" style="width: 0%"></div></div>
                            <span id="dash-perc" class="text-[10px] font-black text-blue-400">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="nav-bar w-full md:w-auto md:min-w-[500px]">
                <div onclick="window.location.href='/' || App.ui?.setMode?.('locate')" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Localizar</span></div>
                <div onclick="window.location.href='/etiquetas' || App.ui?.setMode?.('labels')" class="nav-item"><i class="fa-solid fa-barcode"></i><span>Etiquetas</span></div>
                <div onclick="App.ui.setMode('picking')" id="btn-picking" class="nav-item active"><i class="fa-solid fa-truck-ramp-box"></i><span>Reposição</span></div>
            </nav>

            <label class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl text-[10px] font-black uppercase cursor-pointer border border-slate-800 transition-all">
                <i class="fa-solid fa-file-excel text-emerald-500"></i> Atualizar Base
                <input type="file" class="hidden" accept=".xlsx,.xls" onchange="App.logic.fileHandler.handleUpload(this)">
            </label>
        </header>

        <main id="main-view" class="min-h-[60vh]"></main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCiy4DOVPYYr_UtglmnVWUdZ8SqM26Neo8",
            authDomain: "zpl47-f751d.firebaseapp.com",
            projectId: "zpl47-f751d",
            databaseURL: "https://zpl47-f751d-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SPREADSHEET_CONFIG = {
            ID: '1pQD4qViThkVjxsbFj8yrG7p2wdW0vuo_197hKVtvTRY',
            ABA: 'REPOSIÇÃO ABRIL26'
        };

        const Utils = {
            cleanId: (c) => String(c || '').replace(/\D/g, '').length === 13 ? String(c).substring(7, 12) : String(c).replace(/\D/g, ''),
            formatCoord: (v) => String(v || '').replace(/^(rua|rack|rck|r|niv|col)\s*/gi, '').trim(),
            sanitizeText: (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(),
            escapeHtml: (str) => {
                if (!str) return '';
                return String(str).replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
        };

        const Notifications = {
            show(msg, type = 'info') {
                const container = document.getElementById('notification-container');
                const n = document.createElement('div');
                n.className = `notification ${type}`;
                n.innerHTML = `<div class="notification-content font-bold text-slate-800">${msg}</div>`;
                container.appendChild(n);
                setTimeout(() => n.classList.add('show'), 10);
                setTimeout(() => { n.classList.remove('show'); setTimeout(() => n.remove(), 300); }, 3000);
            }
        };

        window.App = {
            state: { 
                mode: 'picking', 
                inventory: [], 
                activeListener: null, 
                reposicaoData: [], 
                reposicaoPendingCount: 0,
                showReposicaoER: false
            },

            ui: {
                setMode(mode) {
                    App.state.mode = mode;
                    App.state.showReposicaoER = false;
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    document.getElementById(`btn-${mode}`)?.classList.add('active');
                    this.renderPicking();
                    this.syncQueues();
                },

                updateDash() {
                    const total = App.state.inventory.length;
                    if (total === 0) return;
                    const addr = App.state.inventory.filter(p => p.RUA && p.RUA !== '-' && p.RCK && p.RCK !== '-').length;
                    const perc = ((addr / total) * 100).toFixed(1);
                    document.getElementById('dash-fill').style.width = `${perc}%`;
                    document.getElementById('dash-perc').innerText = `${perc}%`;
                },

                showReposicaoER() {
                    App.state.showReposicaoER = true;
                    this.renderPicking();
                },

                hideReposicaoER() {
                    App.state.showReposicaoER = false;
                    this.renderPicking();
                },

                renderPicking() {
                    if (App.state.showReposicaoER) {
                        document.getElementById('main-view').innerHTML = `
                            <div class="reposicao-er-dashboard">
                                <div class="reposicao-er-header">
                                    <h3><i class="fa-solid fa-clipboard-list"></i> REPOSIÇÃO ER - LISTA DE PENDÊNCIAS</h3>
                                    <button id="btnVoltarReposicao" class="btn-voltar">
                                        <i class="fa-solid fa-arrow-left"></i> VOLTAR PARA REPOSIÇÃO
                                    </button>
                                </div>
                                
                                <div class="bg-white">
                                    <button id="copyReposicaoBtn" class="btn-copiar-er">
                                        <i class="fa-regular fa-copy"></i> COPIAR LISTA (CÓDIGO QUANTIDADE)
                                    </button>
                                    
                                    <div id="reposicao-table-wrapper" class="overflow-x-auto">
                                        <div id="reposicao-loader" class="reposicao-er-loader">
                                            <i class="fa-solid fa-spinner fa-spin"></i> Carregando lista de reposição...
                                        </div>
                                        <table id="reposicao-table" class="reposicao-er-table" style="display: none;">
                                            <thead>
                                                <tr>
                                                    <th>Data</th>
                                                    <th>Solicitante</th>
                                                    <th>Código</th>
                                                    <th>Descrição Completa</th>
                                                    <th style="text-align: center">Qtd</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody id="reposicao-tbody"></tbody>
                                        </table>
                                        <div id="reposicao-empty" class="reposicao-er-loader" style="display: none;">
                                            <i class="fa-solid fa-check-circle text-green-500"></i> Tudo pronto! Nenhuma pendência encontrada.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        this.loadReposicaoData();
                        
                        document.getElementById('copyReposicaoBtn')?.addEventListener('click', () => {
                            this.copyReposicaoList();
                        });
                        
                        document.getElementById('btnVoltarReposicao')?.addEventListener('click', () => {
                            this.hideReposicaoER();
                        });
                        
                    } else {
                        document.getElementById('main-view').innerHTML = `
                            <button id="btnVerListaER" class="btn-ver-lista">
                                <i class="fa-solid fa-table-list"></i> REPOSIÇÃO ER - VER LISTA DE PENDÊNCIAS
                                <span id="pendingCountBadge" class="pending-badge-header" style="display: none;">0</span>
                            </button>

                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div class="lg:col-span-5 glass p-8 space-y-4 h-fit">
                                    <h3 class="text-emerald-500 font-black uppercase text-xs">Nova Reposição</h3>
                                    <textarea id="pick-text" class="input-pro w-full h-64 p-4 text-left text-sm" placeholder="Código Qtd (Ex: 87064 10)"></textarea>
                                    <button onclick="App.logic.addPicking()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase shadow-xl">Processar</button>
                                    <button onclick="App.logic.cleanQueue('active_separation')" class="w-full bg-rose-600/20 text-rose-500 py-3 rounded-xl font-bold uppercase text-[10px]">Limpar</button>
                                </div>
                                <div class="lg:col-span-7 glass p-8">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="text-xs font-black uppercase text-slate-400">Itens na Lista</h3>
                                        <button onclick="App.logic.printPickingList()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase">Imprimir Lista</button>
                                    </div>
                                    <div id="queue-box"></div>
                                </div>
                            </div>
                        `;
                        
                        document.getElementById('btnVerListaER')?.addEventListener('click', () => {
                            this.showReposicaoER();
                        });
                        
                        this.checkPendingCount();
                    }
                },

                async checkPendingCount() {
                    try {
                        const url = `https://opensheet.elk.sh/${SPREADSHEET_CONFIG.ID}/${encodeURIComponent(SPREADSHEET_CONFIG.ABA)}`;
                        const response = await fetch(url);
                        
                        if (!response.ok) return;
                        
                        const data = await response.json();
                        
                        if (!Array.isArray(data)) return;
                        
                        const pendingItems = data.filter(row => {
                            const keys = Object.keys(row);
                            const codKey = keys.find(k => /cód|cod|part/i.test(k));
                            const statusKey = keys.find(k => /situa|separa|status|ok/i.test(k));
                            
                            const codValue = codKey ? String(row[codKey] || '').trim() : '';
                            const statusValue = statusKey ? String(row[statusKey] || '').trim() : '';
                            
                            return codValue !== '' && statusValue === '';
                        });
                        
                        App.state.reposicaoPendingCount = pendingItems.length;
                        App.state.reposicaoData = pendingItems;
                        
                        const badge = document.getElementById('pendingCountBadge');
                        if (badge) {
                            if (pendingItems.length > 0) {
                                badge.style.display = 'inline-block';
                                badge.innerText = pendingItems.length;
                                Notifications.show(`⚠️ ${pendingItems.length} item(ns) pendente(s) na planilha! Clique em "VER LISTA" para visualizar.`, 'warning');
                            } else {
                                badge.style.display = 'none';
                            }
                        }
                    } catch (error) {
                        console.error('Erro ao verificar pendências:', error);
                    }
                },

                async loadReposicaoData() {
                    const loader = document.getElementById('reposicao-loader');
                    const table = document.getElementById('reposicao-table');
                    const empty = document.getElementById('reposicao-empty');
                    
                    try {
                        const url = `https://opensheet.elk.sh/${SPREADSHEET_CONFIG.ID}/${encodeURIComponent(SPREADSHEET_CONFIG.ABA)}`;
                        const response = await fetch(url);
                        
                        if (!response.ok) {
                            throw new Error(`Erro ${response.status}`);
                        }
                        
                        const data = await response.json();
                        
                        if (!Array.isArray(data)) {
                            throw new Error("Dados inválidos");
                        }
                        
                        const pendingItems = data.filter(row => {
                            const keys = Object.keys(row);
                            const codKey = keys.find(k => /cód|cod|part/i.test(k));
                            const statusKey = keys.find(k => /situa|separa|status|ok/i.test(k));
                            
                            const codValue = codKey ? String(row[codKey] || '').trim() : '';
                            const statusValue = statusKey ? String(row[statusKey] || '').trim() : '';
                            
                            return codValue !== '' && statusValue === '';
                        });
                        
                        App.state.reposicaoData = pendingItems;
                        App.state.reposicaoPendingCount = pendingItems.length;
                        
                        loader.style.display = 'none';
                        
                        if (pendingItems.length > 0) {
                            this.renderReposicaoTable(pendingItems);
                            table.style.display = 'table';
                            empty.style.display = 'none';
                        } else {
                            table.style.display = 'none';
                            empty.style.display = 'block';
                        }
                        
                    } catch (error) {
                        console.error('Erro:', error);
                        loader.innerHTML = `<i class="fa-solid fa-exclamation-triangle text-red-500"></i> Erro ao conectar com a planilha. Verifique o ID e o nome da aba.`;
                    }
                },

                renderReposicaoTable(data) {
                    const tbody = document.getElementById('reposicao-tbody');
                    if (!tbody) return;
                    
                    tbody.innerHTML = data.map((row, idx) => {
                        const keys = Object.keys(row);
                        
                        const dataOriginal = String(Object.values(row)[0] || '');
                        const dataFormatada = dataOriginal.includes('/') ? dataOriginal.split(' ')[0].substring(0, 5) : dataOriginal;
                        
                        const solicitante = Object.values(row)[5] || '---';
                        
                        const codKey = keys.find(k => /cód|cod|part/i.test(k));
                        const cod = codKey ? row[codKey] : Object.values(row)[2] || '-';
                        
                        const descKey = keys.find(k => /desc/i.test(k));
                        const desc = descKey ? row[descKey] : Object.values(row)[3] || '-';
                        
                        const qtdKey = keys.find(k => /qtd|quant/i.test(k));
                        const qtd = qtdKey ? row[qtdKey] : Object.values(row)[4] || '0';
                        
                        return `
                            <tr style="animation: fadeIn 0.3s ease-out ${idx * 0.05}s forwards; opacity: 0;">
                                <td class="font-semibold text-blue-600">${Utils.escapeHtml(dataFormatada)}</td>
                                <td class="text-gray-500">${Utils.escapeHtml(solicitante)}</td>
                                <td class="font-bold text-blue-600">${Utils.escapeHtml(cod)}</td>
                                <td class="whitespace-normal break-words">${Utils.escapeHtml(desc)}</td>
                                <td class="text-center font-bold text-red-500">${Utils.escapeHtml(qtd)}</td>
                                <td><span class="badge-pendente"><i class="fa-regular fa-clock mr-1"></i>ABERTO</span></td>
                            </tr>
                        `;
                    }).join('');
                },

                copyReposicaoList() {
                    if (!App.state.reposicaoData.length) {
                        Notifications.show('Nenhum item pendente para copiar', 'info');
                        return;
                    }
                    
                    const text = App.state.reposicaoData.map(row => {
                        const keys = Object.keys(row);
                        const codKey = keys.find(k => /cód|cod|part/i.test(k));
                        const qtdKey = keys.find(k => /qtd|quant/i.test(k));
                        
                        const cod = codKey ? row[codKey] : Object.values(row)[2] || '-';
                        const qtd = qtdKey ? row[qtdKey] : Object.values(row)[4] || '0';
                        
                        return `${cod} ${qtd}`;
                    }).join('\n');
                    
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = document.getElementById('copyReposicaoBtn');
                        const original = btn.innerHTML;
                        btn.innerHTML = '<i class="fa-regular fa-check-circle"></i> COPIADO!';
                        btn.classList.add('success');
                        setTimeout(() => {
                            btn.innerHTML = original;
                            btn.classList.remove('success');
                        }, 2000);
                        Notifications.show(`${App.state.reposicaoData.length} itens copiados!`, 'success');
                    });
                },

                syncQueues() {
                    if (App.state.activeListener) App.state.activeListener();
                    App.state.activeListener = db.ref('active_separation').on('value', (s) => this.renderQueueList(s.val()));
                },

                renderQueueList(data) {
                    const box = document.getElementById('queue-box');
                    if (!box) return;
                    if (!data) { box.innerHTML = '<p class="text-center text-slate-500 py-20 font-bold uppercase text-xs">Vazio</p>'; return; }
                    const items = Object.entries(data).map(([id, val]) => ({ id, ...val }));
                    items.sort((a,b) => String(a.rua + a.rck).localeCompare(String(b.rua + b.rck)));

                    box.innerHTML = items.map(i => `
                        <div class="simple-list-item">
                            <div>
                                <div class="simple-list-code">${i.codigo}</div>
                                <div class="text-[9px] text-slate-400 font-bold uppercase">${Utils.formatCoord(i.rua)}.${Utils.formatCoord(i.rck)}.${i.lin}/${i.col}</div>
                                <div class="text-[10px] text-slate-500 truncate w-40">${i.nome}</div>
                                <div class="text-[9px] text-slate-400">Físico: ${i.fisico || 0} | Disp: ${i.disponivel || 0}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="simple-list-qty">${i.qty}</div>
                                <button onclick="App.logic.deleteItem('${i.id}')" class="text-rose-500 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`).join('');
                }
            },

            logic: {
                async addPicking() {
                    const pickText = document.getElementById('pick-text');
                    if (!pickText) return;
                    const lines = pickText.value.split('\n').filter(l => l.trim());
                    for (let line of lines) {
                        const parts = line.trim().split(/\s+/);
                        const code = parts[0], qty = parts[1] || 1, search = Utils.cleanId(code);
                        const p = App.state.inventory.find(i => Utils.cleanId(i.COD) === search) || { NOM: 'N/E' };
                        await db.ref('active_separation').push({ 
                            codigo: code, nome: p.NOM, qty: qty, 
                            rua: p.RUA || '-', rck: p.RCK || '-', lin: p.LIN || '-', col: p.COL || '-',
                            fisico: p.FIS || '0', disponivel: p.EST || '0'
                        });
                    }
                    pickText.value = '';
                    Notifications.show('Lista gerada', 'success');
                },

                async deleteItem(id) {
                    await db.ref(`active_separation/${id}`).remove();
                },

                async cleanQueue(path) {
                    if (confirm('Limpar lista inteira?')) await db.ref(path).remove();
                },

                printPickingList() {
                    db.ref('active_separation').once('value', (snap) => {
                        const items = snap.exists() ? Object.values(snap.val()) : [];
                        items.sort((a,b) => String(a.rua + a.rck).localeCompare(String(b.rua + b.rck)));
                        
                        const printWindow = window.open('', '_blank');
                        printWindow.document.write(`
                            <html>
                            <head>
                                <title>Lista de Reposição - OPERA X</title>
                                <style>
                                    body { font-family: Arial, sans-serif; margin: 20px; }
                                    h1 { text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; }
                                    .date { text-align: right; margin-top: 5px; font-weight: bold; }
                                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                                    th, td { border: 1px solid black; padding: 8px; text-align: left; }
                                    th { background: #f0f0f0; }
                                </style>
                            </head>
                            <body>
                                <h1>LISTA DE REPOSIÇÃO - OPERA X</h1>
                                <div class="date">${new Date().toLocaleString('pt-BR')}</div>
                                <table>
                                    <thead>
                                        <tr><th>Localização</th><th>Código</th><th>Descrição</th><th>Físico</th><th>Disponível</th><th>Qtd</th></tr>
                                    </thead>
                                    <tbody>
                                        ${items.map(i => `
                                            <tr>
                                                <td>${Utils.formatCoord(i.rua)}.${Utils.formatCoord(i.rck)}.${i.lin}/${i.col}</td>
                                                <td>${i.codigo}</td>
                                                <td>${i.nome}</td>
                                                <td>${i.fisico || 0}</td>
                                                <td>${i.disponivel || 0}</td>
                                                <td>${i.qty}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </body>
                            </html>
                        `);
                        printWindow.document.close();
                        printWindow.print();
                    });
                },

                fileHandler: {
                    handleUpload(input) {
                        const file = input.files[0]; if (!file) return;
                        const reader = new FileReader();
                        document.getElementById('loader').classList.remove('hidden');
                        reader.onload = async (e) => {
                            const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                            const data = {};
                            for (let i = 1; i < rows.length; i++) {
                                const r = rows[i];
                                if (r[0]) {
                                    data[r[0]] = { 
                                        COD: r[0], NOM: r[1], RUA: Utils.formatCoord(r[4]), 
                                        RCK: Utils.formatCoord(r[5]), LIN: r[6], COL: r[7], 
                                        FIS: r[8],
                                        EST: r[10]
                                    };
                                }
                            }
                            await db.ref('master_products').set(data);
                            document.getElementById('loader').classList.add('hidden');
                            Notifications.show('Banco Atualizado!', 'success');
                        };
                        reader.readAsArrayBuffer(file);
                    }
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('master_products').on('value', (snap) => {
                App.state.inventory = snap.exists() ? Object.values(snap.val()) : [];
                App.ui.updateDash();
            });
            App.ui.setMode('picking');
        });
    </script>
</body>
</html>
